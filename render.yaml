services:
  # ── Fine-Food Insights: FastAPI Backend ──────────────────────────────────────
  - type: web
    name: fine-food-insights-api
    runtime: python
    plan: free

    # Render sets $PORT automatically; we bind uvicorn to it
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    # Render pings this route to confirm the service is live
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      # DATA_DIR: writable directory for active_reviews.csv (ephemeral on free tier)
      - key: DATA_DIR
        value: data
